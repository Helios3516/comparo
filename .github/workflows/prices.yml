name: Relevés IGA, Maxi et SAQ

on:
  schedule:
    # Jeudi 11:00 UTC : midi à Paris en hiver, 13 h en été.
    - cron: "0 11 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prix-comparo
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer Python
        run: pip install curl_cffi pandas openpyxl

      - name: Installer le site
        working-directory: web
        run: npm ci

      - name: Relever IGA et Maxi
        env:
          MAXI_API_KEY: ${{ secrets.MAXI_API_KEY }}
          IGA_ALGOLIA_APP: ${{ secrets.IGA_ALGOLIA_APP }}
          IGA_ALGOLIA_KEY: ${{ secrets.IGA_ALGOLIA_KEY }}
        run: |
          python ePYcerie-main/export_prix.py
          python ePYcerie-main/comparer.py
          python web/scripts/build_catalog.py

      - name: Relever la SAQ
        run: python web/scripts/fetch_saq.py

      - name: Préparer l'aperçu
        working-directory: web
        run: npx vite-node scripts/emit-preview.ts

      - name: Publier les prix
        run: |
          git config user.name "Comparo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/catalog.json web/public/saq.json web/public/preview.json ePYcerie-main/baie-comeau.xlsx ePYcerie-main/comparaison.xlsx
          if git diff --cached --quiet; then
            echo "Aucun changement de prix."
            exit 0
          fi
          git commit -m "Met à jour les prix IGA, Maxi et SAQ."
          git push
